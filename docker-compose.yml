services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ownedu-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      # Bền vững hóa cơ sở dữ liệu store.json và các tệp tài liệu/video tải lên
      - ./backend/data:/app/data
    networks:
      - ownedu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ownedu-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ownedu-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ownedu-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    networks:
      - ownedu-network
    depends_on:
      - frontend

networks:
  ownedu-network:
    driver: bridge
