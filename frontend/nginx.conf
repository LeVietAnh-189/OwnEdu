server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # Nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache tài nguyên tĩnh (JS, CSS, hình ảnh)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy chuyển tiếp các API requests tới Backend container
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Server-Sent Events (SSE) để stream tiến trình AI không bị đệm
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy kiểm tra sức khỏe
    location /health {
        proxy_pass http://backend:3001/health;
        proxy_set_header Host $host;
    }

    # SPA Routing: Fallback về index.html cho các route React Router
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
